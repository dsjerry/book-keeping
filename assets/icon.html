<!DOCTYPE html>
<html>
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap');
        
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #121212;
            overflow: hidden;
        }
        .logo-container {
            width: 1024px;
            height: 1024px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        .logo {
            position: relative;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            box-shadow: 
                0 0 60px rgba(110, 142, 251, 0.6),
                inset 0 0 20px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
        }
        .logo-icon {
            font-size: 280px;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #6e8efb, #a777e3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 20px rgba(110, 142, 251, 0.7));
        }
        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 140px;
            font-weight: 800;
            background: linear-gradient(45deg, #6e8efb, #a777e3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 15px rgba(110, 142, 251, 0.7));
        }
        .currency {
            color: #27ae60;
            text-shadow: 0 0 15px rgba(39, 174, 96, 0.7);
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(5deg) rotateY(5deg); }
            50% { transform: translateY(-30px) rotateX(-5deg) rotateY(-5deg); }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <div class="particles" id="particles"></div>
        <div class="logo">
            <div class="logo-icon">💰</div>
            <div class="logo-text">J<span class="currency">Keep</span></div>
        </div>
    </div>

    <script>
        // 添加动态粒子效果
        const container = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.width = Math.random() * 10 + 5 + 'px';
            particle.style.height = particle.style.width;
            particle.style.background = `rgba(110, 142, 251, ${Math.random() * 0.4 + 0.1})`;
            particle.style.borderRadius = '50%';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.filter = 'blur(2px)';
            
            // 粒子动画
            particle.animate([
                { transform: 'translate(0, 0)' },
                { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)` }
            ], {
                duration: Math.random() * 10000 + 5000,
                iterations: Infinity,
                direction: 'alternate'
            });
            
            container.appendChild(particle);
        }
    </script>
</body>
</html>
