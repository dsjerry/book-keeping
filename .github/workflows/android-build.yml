name: Android Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (如 1.0.3)'
        required: false
        type: string
      release_notes:
        description: '更新说明'
        required: false
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  android-build:
    name: Android ${{ github.event.inputs.build_type || 'release' }} Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 从 secret 生成 .env（react-native-config 构建期注入；.env 不入库，需在仓库
      # Settings → Secrets and variables → Actions 配置 ENV_BASE64：
      #   Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes(".env"))
      #   Linux:   base64 -w0 .env
      - name: Create .env from secret
        run: echo "${{ secrets.ENV_BASE64 }}" | base64 --decode > .env

      - name: Remove problematic generated directory
        run: |
          if [ -d "node_modules/@sbaiahmed1/react-native-biometrics/android/src/main/java/com/sbaiahmed1/reactnativebiometrics/generated" ]; then
            rm -rf "node_modules/@sbaiahmed1/react-native-biometrics/android/src/main/java/com/sbaiahmed1/reactnativebiometrics/generated"
            echo "Successfully removed generated directory"
          else
            echo "Directory does not exist, skipping removal"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Clean Gradle Build
        run: cd android && ./gradlew clean

      # 如果指定了版本号，更新 build.gradle 中的 versionName
      - name: Update Version Name
        if: ${{ github.event.inputs.version_name != '' }}
        run: |
          sed -i 's/versionName "[0-9.]*"/versionName "${{ github.event.inputs.version_name }}"/' android/app/build.gradle
          echo "Updated versionName to ${{ github.event.inputs.version_name }}"

      # 仅在需要构建发布版本时执行
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.keystore

      # 创建 gradle.properties 文件，包含签名配置
      - name: Setup Gradle Properties
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=my-release-key.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/gradle.properties

      # 构建 Debug APK (包含全量包和各架构分包)
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android && ./gradlew assembleDebug --no-daemon

      # 构建 Release APK (包含全量包和各架构分包)
      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon

      # 构建 Release Bundle (AAB)
      - name: Build Release Bundle
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android && ./gradlew bundleRelease --no-daemon

      # 重命名 APK 文件，添加架构标识
      - name: Rename APKs
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            if [[ "$file" == *"armeabi-v7a"* ]]; then
              mv "$file" "app-release-armeabi-v7a.apk"
            elif [[ "$file" == *"arm64-v8a"* ]]; then
              mv "$file" "app-release-arm64-v8a.apk"
            elif [[ "$file" == *"x86_64"* ]]; then
              mv "$file" "app-release-x86_64.apk"
            elif [[ "$file" == *"x86"* && "$file" != *"x86_64"* ]]; then
              mv "$file" "app-release-x86.apk"
            elif [[ "$file" == *"universal"* || "$file" == "app-release.apk" ]]; then
              mv "$file" "app-release-universal.apk"
            fi
          done
          ls -la *.apk

      # 上传 Debug APK 作为构建产物
      - name: Upload Debug APKs
        if: ${{ github.event.inputs.build_type == 'debug' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk

      # 上传 Release 全量包和各架构分包
      - name: Upload Release APKs
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: |
            android/app/build/outputs/apk/release/*.apk

      # 上传 Release Bundle 作为构建产物
      - name: Upload Release Bundle
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

      # 准备更新说明
      - name: Prepare Release Notes
        id: release_notes
        if: ${{ github.event.inputs.build_type == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=自动构建发布" >> $GITHUB_OUTPUT
          fi

      # 创建 GitHub Release (推送标签时或手动触发 release)
      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release-universal.apk
            android/app/build/outputs/apk/release/app-release-armeabi-v7a.apk
            android/app/build/outputs/apk/release/app-release-arm64-v8a.apk
            android/app/build/outputs/apk/release/app-release-x86.apk
            android/app/build/outputs/apk/release/app-release-x86_64.apk
            android/app/build/outputs/bundle/release/app-release.aab
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version_name) }}
          body: ${{ steps.release_notes.outputs.notes }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version_name) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
